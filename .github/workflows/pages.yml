name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Docusaurus dependencies
        working-directory: website
        run: npm ci

      # Build Docusaurus with the project-site base URL. The complete build is
      # copied into /docs after Jekyll has generated the primary site.
      - name: Build Docusaurus documentation
        working-directory: website
        env:
          DEPLOY_ENV: github-pages
        run: npm run build

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # The repository root is the primary Jekyll site. website/ is excluded
      # from _config.yml so Docusaurus cannot replace the root index page.
      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Publish Docusaurus only at /docs
        run: |
          rm -rf _site/docs
          mkdir -p _site/docs
          cp -R website/build/. _site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
